# OpenOCD 配置: SEGGER J-Link (用于 VS Code cortex-debug 调试)
#
#   - 调试: "运行和调试" 选择 "Debug (JLink)"
#   - 烧录(命令行):
#       openocd -f openocd_jlink.cfg -c "program build/Debug/RM.elf verify reset exit"
#
# 注意: cmake-flash-kit 只支持 ST-Link / DAPLink, J-Link 用户请用上面的命令或 JLink.exe

source [find interface/jlink.cfg]
transport select swd
adapter speed 4000

set CHIPNAME stm32h723
source [find target/stm32h7x.cfg]
