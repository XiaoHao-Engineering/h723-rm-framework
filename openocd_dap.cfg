# OpenOCD 配置: DAPLink / CMSIS-DAP (用于 VS Code cortex-debug 调试)
#
#   - 调试: 左边的"运行和调试"选择 "Debug (OpenOCD + DAPLink)"
#   - 烧录: 请用 cmake-flash-kit, 即 Ctrl+Shift+B 或 .\.flash\flash.ps1
#
# 手动烧录:
#   openocd -f openocd_dap.cfg -c "program build/Debug/RM.elf verify reset exit"

source [find interface/cmsis-dap.cfg]
transport select swd
adapter speed 2000

set CHIPNAME stm32h723
source [find target/stm32h7x.cfg]
